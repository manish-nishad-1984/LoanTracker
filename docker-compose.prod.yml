# Production stack for the VPS.
# Usage on the server:
#   docker compose -f docker-compose.prod.yml up -d --build
#
# - Caddy terminates HTTP/HTTPS on 80/443 and auto-provisions a free Let's Encrypt
#   certificate for the domain in ./Caddyfile.
# - Postgres, API and frontend have NO host ports — they're only reachable on the
#   internal Docker network, so the database is not exposed to the internet.
# - The browser talks only to the domain; the frontend's nginx proxies /api to the
#   API container server-side.

services:
  postgres:
    image: postgres:16-alpine
    container_name: loantracker_db
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-loantracker}
      POSTGRES_USER: ${POSTGRES_USER:-loantracker_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-loantracker_user} -d ${POSTGRES_DB:-loantracker}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: loantracker_api
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__DefaultConnection: "Host=postgres;Port=5432;Database=${POSTGRES_DB:-loantracker};Username=${POSTGRES_USER:-loantracker_user};Password=${POSTGRES_PASSWORD};Include Error Detail=false"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: /api
    container_name: loantracker_frontend
    depends_on:
      - api
    restart: unless-stopped

  caddy:
    image: caddy:2-alpine
    container_name: loantracker_caddy
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - frontend
    restart: unless-stopped

volumes:
  postgres_data:
  caddy_data:
  caddy_config:
